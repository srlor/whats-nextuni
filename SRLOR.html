  <!-- المكتبات المطلوبة -->

  <!-- الأنماط المخصصة -->
  <style>
    :root {
      --primary: #D32F2F;    /* اللون الرئيسي (أحمر) */
      --secondary: #FFF3E0;  /* الخلفية الرئيسية */
      --accent: #FFAB91;     /* لون التمييز */
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--secondary);
      overflow-x: hidden;
    }

    /* قسم البطاقة الرئيسية */
    .hero-section {
      background: linear-gradient(45deg, var(--primary), #B71C1C);
      height: 100vh;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
    }

    /* تصميم البطاقات */
    .feature-card {
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 171, 145, 0.3);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.95);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .feature-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }

    /* الأيقونات الدائرية */
    .icon-wrapper {
      width: 80px;
      height: 80px;
      transition: all 0.3s ease;
    }

    /* تأثيرات النقر */
    .clickable-card {
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .clickable-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
    }

    /* التجاوب مع الشاشات الصغيرة */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.5rem !important;
      }
      
      .feature-card {
        min-height: auto;
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // تفعيل الحركات عند التمرير
    document.addEventListener('DOMContentLoaded', function() {
      const animateElements = document.querySelectorAll('[data-animation]');
      
      const animateOnScroll = () => {
        animateElements.forEach(el => {
          const rect = el.getBoundingClientRect();
          const animation = el.dataset.animation;
          
          if (rect.top < window.innerHeight * 0.8) {
            el.classList.add('animate__animated', animation);
            el.style.opacity = '1';
          }
        });
      };

      window.addEventListener('scroll', animateOnScroll);
      animateOnScroll();
    });

    // تأثير النقر على البطاقات
    document.querySelectorAll('.clickable-card').forEach(card => {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        const link = this.closest('a').href;
        
        // تأثير النقر
        this.style.transform = 'scale(0.95)';
        
        setTimeout(() => {
          window.location.href = link;
        }, 300);
      });
    });
  </script>
